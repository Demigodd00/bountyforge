name: BountyForge CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install GenLayer toolchain
        run: python -m pip install -r requirements-deploy.txt
      - name: Prepare pinned GenVM runner
        run: python scripts/prepare_gltest_runner.py
      - name: Lint Intelligent Contract
        run: genvm-lint check contracts/bounty_forge.py
      - name: Typecheck Intelligent Contract
        run: genvm-lint typecheck contracts/bounty_forge.py
      - name: Run direct-mode regressions
        run: pytest tests/direct -q
      - name: Test deployment safeguards
        run: pytest tests/unit/test_bountyforge_deployment.py -q
      - name: Compile deployment tooling
        run: python -m compileall -q scripts

  frontend:
    runs-on: ubuntu-latest
    env:
      NEXT_PUBLIC_BOUNTYFORGE_ADDRESS: "0xCD7E3bad31F1C26F139907621A569940C2AD70Bd"
      NEXT_PUBLIC_NETWORK_NAME: "StudioNet"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
      - uses: pnpm/action-setup@v6
        with:
          version: "11.19.0"
      - name: Install locked dependencies
        working-directory: apps/bountyforge-web
        run: pnpm install --frozen-lockfile
      - name: Typecheck
        working-directory: apps/bountyforge-web
        run: pnpm typecheck
      - name: Test wallet and lifecycle UI
        working-directory: apps/bountyforge-web
        run: pnpm test
      - name: Build production dApp
        working-directory: apps/bountyforge-web
        run: pnpm build
      - name: Audit production dependencies
        working-directory: apps/bountyforge-web
        run: pnpm audit:prod

  studionet-integration:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    env:
      NEXT_PUBLIC_BOUNTYFORGE_ADDRESS: "0xCD7E3bad31F1C26F139907621A569940C2AD70Bd"
      NEXT_PUBLIC_NETWORK_NAME: "StudioNet"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install GenLayer toolchain
        run: python -m pip install -r requirements-deploy.txt
      - name: Run isolated StudioNet balance tests
        run: gltest tests/integration/test_bounty_forge_studionet.py --network studionet -v -s
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
      - uses: pnpm/action-setup@v6
        with:
          version: "11.19.0"
      - name: Install locked frontend dependencies
        working-directory: apps/bountyforge-web
        run: pnpm install --frozen-lockfile
      - name: Run canonical frontend transaction flow on StudioNet
        working-directory: apps/bountyforge-web
        run: pnpm test:studionet-frontend
